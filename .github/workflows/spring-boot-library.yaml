name: Spring Boot Library CI

# Reusable workflow for Vempain Spring Boot libraries that publish to
# GitHub Packages (Maven) but do NOT produce a Docker image.
#
# Callers: vempain-auth

on:
  workflow_call:
    inputs:
      java_version:
        description: 'Temurin JDK version'
        type: string
        default: '25'
    secrets:
      VEMPAIN_ACTION_TOKEN:
        description: 'Organisation token with packages:write used for publishing'
        required: true
      COPILOT_GITHUB_TOKEN:
        description: 'Organisation token used to generate release notes'
        required: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Run all tests
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java temurin ${{ inputs.java_version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ inputs.java_version }}
          distribution: 'temurin'

      - name: Run tests with Gradle
        run: ./gradlew clean test

  # ──────────────────────────────────────────────────────────────────────────
  publish:
    name: Package and publish to GitHub Maven
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java temurin ${{ inputs.java_version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ inputs.java_version }}
          distribution: 'temurin'

      - name: Generate versions
        id: version
        uses: Vempain/vempain-workflows/.github/actions/generate-version@main

      - name: Configure Maven for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.VEMPAIN_ACTION_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Publish package
        run: ./gradlew publish -PreleaseVersion=${targetVersion} --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.VEMPAIN_ACTION_TOKEN }}
          targetVersion: ${{ steps.version.outputs.new_version }}

      - name: Create GitHub Release
        uses: Vempain/vempain-workflows/.github/actions/create-release@main
        with:
          github_token: ${{ github.token }}
          copilot_github_token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.new_version }}
          target_sha: ${{ github.sha }}
          release_name: Release ${{ steps.version.outputs.new_version }}
          release_body: |
            Build artifacts:
            - Maven package list: https://github.com/orgs/${{ github.repository_owner }}/packages?repo_name=${{ github.event.repository.name }}&ecosystem=maven

            Artifact tags published:
            - latest
            - ${{ steps.version.outputs.main_version }}
            - ${{ steps.version.outputs.base_version }}
            - ${{ steps.version.outputs.new_version }}
