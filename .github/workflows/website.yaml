name: Website CI

# Reusable workflow for Vempain websites that combine a PHP Slim backend
# with a TypeScript/React frontend, each built into a separate Docker image.
#
# Callers: vempain-website

on:
  workflow_call:
    inputs:
      php_version:
        description: 'PHP version (shivammathur/setup-php)'
        type: string
        default: '8.5'
      php_extensions:
        description: 'Comma-separated PHP extensions to install'
        type: string
        default: 'bcmath, mbstring, pdo_pgsql'
      node_version:
        description: 'Node.js version for the frontend'
        type: string
        default: '24'
      backend_image:
        description: 'Full GHCR image name for the backend (e.g. ghcr.io/vempain/vempain-site-backend)'
        type: string
        required: true
      frontend_image:
        description: 'Full GHCR image name for the frontend (e.g. ghcr.io/vempain/vempain-site-frontend)'
        type: string
        required: true
      backend_dockerfile:
        description: 'Path to the backend Dockerfile relative to the repo root'
        type: string
        default: 'backend/Dockerfile'
      backend_context:
        description: 'Docker build context for the backend'
        type: string
        default: 'backend'
      frontend_dockerfile:
        description: 'Path to the frontend Dockerfile relative to the repo root'
        type: string
        default: 'frontend/Dockerfile'
      frontend_context:
        description: 'Docker build context for the frontend'
        type: string
        default: 'frontend'
    secrets:
      VEMPAIN_ACTION_TOKEN:
        description: 'Organisation token with packages:write used for GitHub API calls'
        required: false

env:
  REGISTRY: ghcr.io

concurrency: build

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  backend-tests:
    name: PHP backend – lint & format check
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP ${{ inputs.php_version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ${{ inputs.php_extensions }}

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-progress --prefer-dist
        env:
          COMPOSER_MEMORY_LIMIT: 2G

      - name: Run backend formatting fix
        working-directory: backend
        run: ./vendor/bin/phpcbf

      - name: Run backend lint
        working-directory: backend
        run: composer lint

  # ──────────────────────────────────────────────────────────────────────────
  frontend-tests:
    name: TypeScript frontend – lint & test
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: backend-tests
    permissions:
      contents: read
      packages: read
    env:
      VEMPAIN_ACTION_TOKEN: ${{ secrets.VEMPAIN_ACTION_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.VEMPAIN_ACTION_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup Node and Yarn auth
        uses: Vempain/vempain-workflows/.github/actions/setup-node-yarn-auth@main
        with:
          node_version: ${{ inputs.node_version }}
          use_scoped_registry: 'true'
          token: ${{ env.VEMPAIN_ACTION_TOKEN }}
          working_directory: frontend
          use_cache: 'true'
          cache_package_manager: 'yarn'
          cache_dependency_path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install
        env:
          VEMPAIN_ACTION_TOKEN: ${{ env.VEMPAIN_ACTION_TOKEN }}
          NODE_AUTH_TOKEN: ${{ env.NODE_AUTH_TOKEN }}
          YARN_ENABLE_HARDENED_MODE: false

      - name: Run frontend lint
        working-directory: frontend
        run: yarn lint
        env:
          VEMPAIN_ACTION_TOKEN: ${{ env.VEMPAIN_ACTION_TOKEN }}

      - name: Run frontend tests
        working-directory: frontend
        run: yarn test --passWithNoTests --watchAll=false
        env:
          VEMPAIN_ACTION_TOKEN: ${{ env.VEMPAIN_ACTION_TOKEN }}

      - name: Run frontend coverage
        working-directory: frontend
        run: yarn test:coverage --passWithNoTests
        env:
          VEMPAIN_ACTION_TOKEN: ${{ env.VEMPAIN_ACTION_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  release-and-publish:
    name: Version, build and push Docker images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      packages: write
    env:
      VEMPAIN_ACTION_TOKEN: ${{ secrets.VEMPAIN_ACTION_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.VEMPAIN_ACTION_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup Node and Yarn auth
        uses: Vempain/vempain-workflows/.github/actions/setup-node-yarn-auth@main
        with:
          node_version: ${{ inputs.node_version }}
          use_scoped_registry: 'true'
          token: ${{ env.VEMPAIN_ACTION_TOKEN }}
          working_directory: frontend
          use_cache: 'true'
          cache_package_manager: 'yarn'
          cache_dependency_path: frontend/yarn.lock


      - name: Generate versions
        id: version
        uses: Vempain/vempain-workflows/.github/actions/generate-version@main

      - name: Copy VERSION into frontend
        shell: bash
        run: |
          if [ -f VERSION ]; then
            cp VERSION frontend/VERSION
            echo "Copied VERSION into frontend/VERSION"
          else
            echo "ERROR: VERSION file not found in repo root" >&2
            exit 1
          fi

      - name: Set new package version in frontend
        working-directory: frontend
        run: |
          echo "Setting version: ${newVersion}"
          yarn version --immediate ${newVersion}
        env:
          newVersion: ${{ steps.version.outputs.new_version }}
          VEMPAIN_ACTION_TOKEN: ${{ env.VEMPAIN_ACTION_TOKEN }}

      - name: Build frontend production package
        working-directory: frontend
        run: |
          yarn install
          yarn build:production
        env:
          VEMPAIN_ACTION_TOKEN: ${{ env.VEMPAIN_ACTION_TOKEN }}
          NODE_AUTH_TOKEN: ${{ env.NODE_AUTH_TOKEN }}
          YARN_ENABLE_HARDENED_MODE: false

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend Docker image
        shell: bash
        run: |
          backendImage="${{ inputs.backend_image }}"
          docker build --progress=plain -f ${{ inputs.backend_dockerfile }} -t ${backendImage}:latest ${{ inputs.backend_context }}
          echo "Tagging backend image: ${mainVersion}, ${baseVersion}, ${newVersion}"
          docker tag ${backendImage}:latest ${backendImage}:${mainVersion}
          docker tag ${backendImage}:latest ${backendImage}:${baseVersion}
          docker tag ${backendImage}:latest ${backendImage}:${newVersion}
          docker push --all-tags ${backendImage}
        env:
          mainVersion: ${{ steps.version.outputs.main_version }}
          baseVersion: ${{ steps.version.outputs.base_version }}
          newVersion: ${{ steps.version.outputs.new_version }}

      - name: Build and push frontend Docker image
        shell: bash
        run: |
          frontendImage="${{ inputs.frontend_image }}"
          docker build --progress=plain -f ${{ inputs.frontend_dockerfile }} -t ${frontendImage}:latest ${{ inputs.frontend_context }}
          echo "Tagging frontend image: ${mainVersion}, ${baseVersion}, ${newVersion}"
          docker tag ${frontendImage}:latest ${frontendImage}:${mainVersion}
          docker tag ${frontendImage}:latest ${frontendImage}:${baseVersion}
          docker tag ${frontendImage}:latest ${frontendImage}:${newVersion}
          docker push --all-tags ${frontendImage}
        env:
          mainVersion: ${{ steps.version.outputs.main_version }}
          baseVersion: ${{ steps.version.outputs.base_version }}
          newVersion: ${{ steps.version.outputs.new_version }}

      - name: Compose release notes
        id: release_notes
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.new_version }}
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          FRONTEND_IMAGE: ${{ inputs.frontend_image }}
          MAIN_VERSION: ${{ steps.version.outputs.main_version }}
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
        run: |
          backendPackageName="${BACKEND_IMAGE##*/}"
          frontendPackageName="${FRONTEND_IMAGE##*/}"
          backendPackageUrl="https://github.com/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/package/${backendPackageName}"
          frontendPackageUrl="https://github.com/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/package/${frontendPackageName}"

          {
            echo "body<<EOF"
            echo "Automated release for ${TAG}"
            echo
            echo "Build artifacts:"
            echo "- Backend Docker image package: ${backendPackageUrl}"
            echo "- Frontend Docker image package: ${frontendPackageUrl}"
            echo
            echo "Docker tags pushed:"
            echo "- latest"
            echo "- ${MAIN_VERSION}"
            echo "- ${BASE_VERSION}"
            echo "- ${TAG}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: Vempain/vempain-workflows/.github/actions/create-release@main
        with:
          github_token: ${{ github.token }}
          tag_name: ${{ steps.version.outputs.new_version }}
          target_sha: ${{ github.sha }}
          create_tag: 'true'
          release_name: Release ${{ steps.version.outputs.new_version }}
          release_body: ${{ steps.release_notes.outputs.body }}
          draft: 'false'
          prerelease: 'false'
          generate_release_notes: 'true'

