name: Frontend SPA CI
# Reusable workflow for Vempain TypeScript/JS single-page-application
# repositories that build a Docker image.
#
# Callers: vempain-admin-frontend, vempain-file-frontend, vempain-site
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ Key inputs                                                              │
# │  use_scoped_registry  – add @vempain scope pointing at npm.pkg.github  │
# │  use_immutable_install – pass --immutable to yarn install               │
# │  use_corepack         – run `corepack enable` before Node setup         │
# │  build_command        – yarn script for the production build            │
# │  run_coverage         – run yarn test:coverage after tests              │
# │  commit_version_bump  – commit package.json version back to the branch  │
# │  push_all_version_tags – push latest/major/minor/patch (true) or only  │
# │                          the patch-level version tag (false)            │
# │  version_tag_prefix   – prefix for git tags, e.g. '' or 'v'            │
# └─────────────────────────────────────────────────────────────────────────┘
on:
  workflow_call:
    inputs:
      node_version:
        description: 'Node.js version'
        type: string
        default: '24'
      use_scoped_registry:
        description: 'Configure npm registry for @vempain scope'
        type: boolean
        default: false
      use_immutable_install:
        description: 'Pass --immutable to yarn install'
        type: boolean
        default: false
      use_corepack:
        description: 'Run corepack enable before Node setup'
        type: boolean
        default: false
      build_command:
        description: 'Yarn script for the production build (e.g. build:production or build)'
        type: string
        default: 'build:production'
      test_extra_flags:
        description: 'Flags appended to `yarn test`'
        type: string
        default: '--passWithNoTests --watchAll=false'
      run_coverage:
        description: 'Run `yarn test:coverage` as a separate step'
        type: boolean
        default: true
      commit_version_bump:
        description: 'Commit the package.json version bump back to the branch'
        type: boolean
        default: false
      push_all_version_tags:
        description: 'Push latest/major/minor/patch tags (true) or only the patch version tag (false)'
        type: boolean
        default: true
      version_tag_prefix:
        description: "Prefix for git version tags (empty string or 'v')"
        type: string
        default: ''
    secrets:
      VEMPAIN_ACTION_TOKEN:
        description: 'Organisation token used for private @vempain packages and GitHub API calls'
        required: false
env:
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: vempain
  IMAGE_NAME: ${{ github.repository }}
concurrency: build
jobs:
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Run all tests
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      VEMPAIN_ACTION_TOKEN: ${{ secrets.VEMPAIN_ACTION_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.VEMPAIN_ACTION_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Setup Node and Yarn auth
        uses: Vempain/vempain-workflows/.github/actions/setup-node-yarn-auth@main
        with:
          node_version: ${{ inputs.node_version }}
          use_corepack: ${{ inputs.use_corepack }}
          use_scoped_registry: ${{ inputs.use_scoped_registry }}
          token: ${{ env.VEMPAIN_ACTION_TOKEN }}
          fallback_token: ${{ github.token }}
          use_cache: 'true'
          cache_package_manager: 'yarn'
      - name: Install dependencies
        run: yarn install ${{ inputs.use_immutable_install && '--immutable' || '' }}
        env:
          VEMPAIN_ACTION_TOKEN: ${{ env.VEMPAIN_ACTION_TOKEN }}
          NODE_AUTH_TOKEN: ${{ env.NODE_AUTH_TOKEN }}
          YARN_ENABLE_HARDENED_MODE: false
      - name: Build
        run: yarn build
        env:
          VEMPAIN_ACTION_TOKEN: ${{ env.VEMPAIN_ACTION_TOKEN }}
          NODE_AUTH_TOKEN: ${{ env.NODE_AUTH_TOKEN }}
      - name: Run tests
        run: yarn test ${{ inputs.test_extra_flags }}
        env:
          VEMPAIN_ACTION_TOKEN: ${{ env.VEMPAIN_ACTION_TOKEN }}
          NODE_AUTH_TOKEN: ${{ env.NODE_AUTH_TOKEN }}
      - name: Run coverage
        if: inputs.run_coverage
        run: yarn test:coverage
        env:
          VEMPAIN_ACTION_TOKEN: ${{ env.VEMPAIN_ACTION_TOKEN }}
          NODE_AUTH_TOKEN: ${{ env.NODE_AUTH_TOKEN }}
  # ──────────────────────────────────────────────────────────────────────────
  version-and-upload:
    name: Version, build and push Docker image
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (inputs.commit_version_bump == false || github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VEMPAIN_ACTION_TOKEN: ${{ secrets.VEMPAIN_ACTION_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.VEMPAIN_ACTION_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup Node and Yarn auth
        uses: Vempain/vempain-workflows/.github/actions/setup-node-yarn-auth@main
        with:
          node_version: ${{ inputs.node_version }}
          use_corepack: ${{ inputs.use_corepack }}
          use_scoped_registry: ${{ inputs.use_scoped_registry }}
          token: ${{ env.VEMPAIN_ACTION_TOKEN }}
          fallback_token: ${{ github.token }}
          use_cache: 'true'
          cache_package_manager: 'yarn'
      - name: Generate versions
        id: version
        uses: Vempain/vempain-workflows/.github/actions/generate-version@main
        with:
          tag_prefix: ${{ inputs.version_tag_prefix }}
      - name: Set new package version
        run: |
          echo "Setting version: ${newVersion}"
          yarn version --immediate ${newVersion}
        env:
          newVersion: ${{ steps.version.outputs.new_version }}
          VEMPAIN_ACTION_TOKEN: ${{ env.VEMPAIN_ACTION_TOKEN }}
          NODE_AUTH_TOKEN: ${{ env.NODE_AUTH_TOKEN }}
      - name: Commit and push version bump
        if: inputs.commit_version_bump && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          newVersion="${{ steps.version.outputs.new_version }}"
          prefix="${{ inputs.version_tag_prefix }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          [ -f yarn.lock ] && git add yarn.lock
          if git diff --cached --quiet; then
            echo "No version changes to commit."
          else
            git commit -m "chore(release): ${prefix}${newVersion} [skip ci]"
            git tag "${prefix}${newVersion}"
            git push --atomic origin HEAD "refs/tags/${prefix}${newVersion}"
          fi
      - name: Build production package
        run: |
          yarn install ${{ inputs.use_immutable_install && '--immutable' || '' }}
          yarn ${{ inputs.build_command }}
        env:
          VEMPAIN_ACTION_TOKEN: ${{ env.VEMPAIN_ACTION_TOKEN }}
          NODE_AUTH_TOKEN: ${{ env.NODE_AUTH_TOKEN }}
          YARN_ENABLE_HARDENED_MODE: false
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image (all version tags)
        if: inputs.push_all_version_tags
        shell: bash
        run: |
          imgName="${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')"
          docker build . --tag ${imgName}:latest
          echo "Setting versions to: '${mainVersion}', '${baseVersion}', '${newVersion}'"
          docker image tag ${imgName}:latest ${imgName}:${mainVersion}
          docker image tag ${imgName}:latest ${imgName}:${baseVersion}
          docker image tag ${imgName}:latest ${imgName}:${newVersion}
          docker push --all-tags ${imgName}
        env:
          mainVersion: ${{ steps.version.outputs.main_version }}
          baseVersion: ${{ steps.version.outputs.base_version }}
          newVersion: ${{ steps.version.outputs.new_version }}
      - name: Build and push Docker image (version tag only)
        if: '!inputs.push_all_version_tags'
        shell: bash
        run: |
          imgName="${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')"
          docker build . --tag ${imgName}:${{ steps.version.outputs.new_version }}
          docker push ${imgName}:${{ steps.version.outputs.new_version }}
      - name: Compose release notes
        id: release_notes
        shell: bash
        env:
          TAG: ${{ inputs.version_tag_prefix }}${{ steps.version.outputs.new_version }}
          MAIN_VERSION: ${{ steps.version.outputs.main_version }}
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
          PUSH_ALL_VERSION_TAGS: ${{ inputs.push_all_version_tags }}
        run: |
          packageUrl="https://github.com/orgs/${GITHUB_REPOSITORY_OWNER}/packages?repo_name=${GITHUB_REPOSITORY#*/}&ecosystem=container"
          {
            echo "body<<EOF"
            echo "Automated release for ${TAG}"
            echo
            echo "Build artifacts:"
            echo "- Docker image package: ${packageUrl}"
            echo
            echo "Docker tags pushed:"
            if [ "${PUSH_ALL_VERSION_TAGS}" = "true" ]; then
              echo "- latest"
              echo "- ${MAIN_VERSION}"
              echo "- ${BASE_VERSION}"
            fi
            echo "- ${TAG}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: Vempain/vempain-workflows/.github/actions/create-release@main
        with:
          github_token: ${{ github.token }}
          tag_name: ${{ inputs.version_tag_prefix }}${{ steps.version.outputs.new_version }}
          target_sha: ${{ github.sha }}
          create_tag: ${{ inputs.commit_version_bump == false }}
          release_name: Release ${{ inputs.version_tag_prefix }}${{ steps.version.outputs.new_version }}
          release_body: ${{ steps.release_notes.outputs.body }}
          draft: 'false'
          prerelease: 'false'
          generate_release_notes: 'true'
