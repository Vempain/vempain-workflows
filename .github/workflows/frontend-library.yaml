name: Frontend Library CI

# Reusable workflow for Vempain TypeScript/JS libraries that are published
# to GitHub Packages (npm) but do NOT produce a Docker image.
#
# Callers: vempain-auth-frontend

on:
  workflow_call:
    inputs:
      node_version:
        description: 'Node.js version'
        type: string
        default: '22'
    secrets:
      VEMPAIN_ACTION_TOKEN:
        description: 'Organisation token with packages:write used for npm publish'
        required: true
      COPILOT_GITHUB_TOKEN:
        description: 'Organisation token used to generate release notes'
        required: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Run all tests
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: 'https://npm.pkg.github.com'

      - name: Cache Yarn
        uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: |
          yarn cache clean
          yarn install

      - name: Run tests
        run: yarn test

      - name: Run coverage
        run: yarn test:coverage

  # ──────────────────────────────────────────────────────────────────────────
  publish:
    name: Package and publish to GitHub NPM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: 'https://npm.pkg.github.com'

      - name: Cache Yarn
        uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: |
          yarn cache clean
          yarn install

      - name: Build
        run: yarn build:production

      - name: Generate versions
        id: version
        uses: Vempain/vempain-workflows/.github/actions/generate-version@main

      - name: Set new package version
        run: |
          echo "Setting version: ${newVersion}"
          yarn version --immediate ${newVersion}
        env:
          newVersion: ${{ steps.version.outputs.new_version }}

      - name: Publish to GitHub Packages (npm)
        run: |
          set -euo pipefail
          echo "registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.VEMPAIN_ACTION_TOKEN }}" >> .npmrc
          echo "@vempain:registry=https://npm.pkg.github.com" >> .npmrc

          packageName="$(node -p "require('./package.json').name")"
          packageVersion="${{ steps.version.outputs.new_version }}"

          if npm view "${packageName}@${packageVersion}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "Package ${packageName}@${packageVersion} already exists in GitHub Packages, skipping publish."
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VEMPAIN_ACTION_TOKEN }}

      - name: Create tag
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{ steps.version.outputs.new_version }}',
              sha: context.sha
            })

      - name: Create GitHub Release
        uses: Vempain/vempain-workflows/.github/actions/create-release@main
        with:
          github-token: ${{ github.token }}
          copilot_github_token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.new_version }}
          target_sha: ${{ github.sha }}
          release_name: Release ${{ steps.version.outputs.new_version }}
          release_body: |
            Build artifacts:
            - npm package list: https://github.com/orgs/${{ github.repository_owner }}/packages?repo_name=${{ github.event.repository.name }}&ecosystem=npm

            NPM package versions published:
            - latest
            - ${{ steps.version.outputs.main_version }}
            - ${{ steps.version.outputs.base_version }}
            - ${{ steps.version.outputs.new_version }}
