name: Setup Node and Yarn scoped auth

description: Configure Node.js and Yarn authentication for private npm scopes.

inputs:
  node_version:
    description: Node.js version
    required: false
    default: '24'
  use_corepack:
    description: Run corepack enable before Node setup
    required: false
    default: 'false'
  use_scoped_registry:
    description: Configure npm scope auth for private registry
    required: false
    default: 'false'
  scope_name:
    description: npm scope without @ prefix
    required: false
    default: 'vempain'
  registry_url:
    description: npm registry URL for the scope
    required: false
    default: 'https://npm.pkg.github.com'
  token:
    description: Auth token used for private package downloads
    required: false
    default: ''
  fallback_token:
    description: Optional fallback token when primary token is unavailable in this context
    required: false
    default: ''
  working_directory:
    description: Directory where Yarn config should be applied
    required: false
    default: '.'
  use_cache:
    description: Enable dependency cache in setup-node
    required: false
    default: 'false'
  cache_package_manager:
    description: Package manager for setup-node cache
    required: false
    default: 'yarn'
  cache_dependency_path:
    description: Lockfile path(s) for setup-node cache
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Enable Corepack
      if: inputs.use_corepack == 'true'
      shell: bash
      run: corepack enable

    - name: Set up Node.js (no cache, no scoped registry)
      if: inputs.use_cache != 'true' && inputs.use_scoped_registry != 'true'
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node_version }}

    - name: Set up Node.js (no cache, scoped registry)
      if: inputs.use_cache != 'true' && inputs.use_scoped_registry == 'true'
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node_version }}
        registry-url: ${{ inputs.registry_url }}
        scope: ${{ format('@{0}', inputs.scope_name) }}

    - name: Set up Node.js (cache, no scoped registry)
      if: inputs.use_cache == 'true' && inputs.use_scoped_registry != 'true' && inputs.cache_dependency_path == ''
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node_version }}
        cache: ${{ inputs.cache_package_manager }}

    - name: Set up Node.js (cache, no scoped registry, lockfile path)
      if: inputs.use_cache == 'true' && inputs.use_scoped_registry != 'true' && inputs.cache_dependency_path != ''
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node_version }}
        cache: ${{ inputs.cache_package_manager }}
        cache-dependency-path: ${{ inputs.cache_dependency_path }}

    - name: Set up Node.js (cache, scoped registry)
      if: inputs.use_cache == 'true' && inputs.use_scoped_registry == 'true' && inputs.cache_dependency_path == ''
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node_version }}
        cache: ${{ inputs.cache_package_manager }}
        registry-url: ${{ inputs.registry_url }}
        scope: ${{ format('@{0}', inputs.scope_name) }}

    - name: Set up Node.js (cache, scoped registry, lockfile path)
      if: inputs.use_cache == 'true' && inputs.use_scoped_registry == 'true' && inputs.cache_dependency_path != ''
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node_version }}
        cache: ${{ inputs.cache_package_manager }}
        cache-dependency-path: ${{ inputs.cache_dependency_path }}
        registry-url: ${{ inputs.registry_url }}
        scope: ${{ format('@{0}', inputs.scope_name) }}

    - name: Resolve package token
      id: resolve_token
      if: inputs.use_scoped_registry == 'true'
      shell: bash
      run: |
        set -euo pipefail

        echo "DEBUG: PRIMARY_TOKEN length: ${#PRIMARY_TOKEN}"
        echo "DEBUG: FALLBACK_TOKEN length: ${#FALLBACK_TOKEN}"

        effective_token="${PRIMARY_TOKEN}"
        if [ -z "${effective_token}" ]; then
          effective_token="${FALLBACK_TOKEN}"
        fi

        if [ -z "${effective_token}" ]; then
          echo "::error::A package token is required to download private @${{ inputs.scope_name }} packages from ${{ inputs.registry_url }}"
          exit 1
        fi

        echo "DEBUG: Using token of length: ${#effective_token}"
        echo "auth_token=${effective_token}" >> "$GITHUB_OUTPUT"
      env:
        PRIMARY_TOKEN: ${{ inputs.token }}
        FALLBACK_TOKEN: ${{ inputs.fallback_token }}

    - name: Configure Yarn npm scope authentication
      if: inputs.use_scoped_registry == 'true'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        set -euo pipefail
        
        echo "DEBUG: AUTH_TOKEN length: ${#AUTH_TOKEN}"
        
        # Inject token into .yarnrc.yml by replacing empty token values
        if [ -f .yarnrc.yml ]; then
          echo "DEBUG: Original .yarnrc.yml:"
          cat .yarnrc.yml
        
          # Use sed to replace empty auth tokens with actual token value
          # Use different quote style to allow variable expansion
          sed -i.bak "s/npmAuthToken: \"\"/npmAuthToken: \"${AUTH_TOKEN}\"/g" .yarnrc.yml
        
          echo "DEBUG: Updated .yarnrc.yml:"
          cat .yarnrc.yml
        
          echo "DEBUG: Checking for token in file:"
          grep -c "npmAuthToken:" .yarnrc.yml || true
        fi
        
        # Use yarn config set for both file and in-memory configuration
        yarn config set npmAlwaysAuth true
        yarn config set npmAuthToken "${AUTH_TOKEN}"
        yarn config set npmScopes.${{ inputs.scope_name }}.npmRegistryServer "${{ inputs.registry_url }}"
        yarn config set npmScopes.${{ inputs.scope_name }}.npmAlwaysAuth true
        yarn config set npmScopes.${{ inputs.scope_name }}.npmAuthToken "${AUTH_TOKEN}"
        yarn config set 'npmRegistries["${{ inputs.registry_url }}"].npmAlwaysAuth' true
        yarn config set 'npmRegistries["${{ inputs.registry_url }}"].npmAuthToken' "${AUTH_TOKEN}"
      env:
        AUTH_TOKEN: ${{ steps.resolve_token.outputs.auth_token }}

    - name: Configure npmrc authentication fallback
      if: inputs.use_scoped_registry == 'true'
      shell: bash
      run: |
        npmrc_path="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
        registry_host="${{ inputs.registry_url }}"
        registry_host="${registry_host#https://}"
        registry_host="${registry_host#http://}"
        registry_host="${registry_host%/}"

        echo "DEBUG: npmrc_path: ${npmrc_path}"
        echo "DEBUG: AUTH_TOKEN length: ${#AUTH_TOKEN}"

        {
          echo "@${{ inputs.scope_name }}:registry=${{ inputs.registry_url }}"
          echo "//${registry_host}/:_authToken=${AUTH_TOKEN}"
          echo "//${registry_host}/:always-auth=true"
          echo "//${registry_host}/download/:_authToken=${AUTH_TOKEN}"
          echo "//${registry_host}/download/:always-auth=true"
        } >> "${npmrc_path}"
        
        echo "DEBUG: .npmrc content:"
        cat "${npmrc_path}"
      env:
        AUTH_TOKEN: ${{ steps.resolve_token.outputs.auth_token }}

