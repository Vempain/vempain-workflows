name: Create git tag and GitHub release

description: Optionally create a git tag and then create a GitHub release with Copilot-generated notes (GitHub's generated notes when Copilot is unavailable).

inputs:
  github_token:
    description: Token for GitHub API calls
    required: true
  copilot_github_token:
    description: Token used by Copilot to generate release notes
    required: true
  tag_name:
    description: Tag name to create and release
    required: true
  target_sha:
    description: Commit SHA the tag points to
    required: false
    default: ''
  create_tag:
    description: Whether to create the git tag before creating release
    required: false
    default: 'true'
  release_name:
    description: Release display name
    required: true
  release_body:
    description: Additional release details appended to the generated notes
    required: true
  draft:
    description: Create release as draft
    required: false
    default: 'false'
  prerelease:
    description: Mark release as prerelease
    required: false
    default: 'false'
outputs:
  release_url:
    description: URL of the created release
    value: ${{ steps.create_release.outputs.release_url }}
  release_id:
    description: ID of the created release
    value: ${{ steps.create_release.outputs.release_id }}

runs:
  using: composite
  steps:
    - name: "[create-release] Create git tag"
      if: inputs.create_tag == 'true'
      uses: actions/github-script@v9
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const tag = '${{ inputs.tag_name }}';
          const sha = '${{ inputs.target_sha }}' || context.sha;
          try {
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha
            });
          } catch (error) {
            if (error.status !== 422) {
              throw error;
            }

            const existing = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${tag}`
            });
            if (existing.data.object.sha !== sha) {
              throw new Error(`Tag ${tag} already exists at ${existing.data.object.sha}, expected ${sha}.`);
            }
            core.info(`Tag ${tag} already points to ${sha}; continuing.`);
          }

    - name: "[create-release] Create GitHub Release"
      id: create_release
      uses: actions/github-script@v9
      env:
        RELEASE_TAG: ${{ inputs.tag_name }}
        RELEASE_NAME: ${{ inputs.release_name }}
        RELEASE_BODY: ${{ inputs.release_body }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const tag = process.env.RELEASE_TAG;
          const response = await github.rest.repos.createRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag_name: tag,
            name: process.env.RELEASE_NAME,
            body: process.env.RELEASE_BODY,
            draft: ${{ inputs.draft == 'true' }},
            prerelease: ${{ inputs.prerelease == 'true' }}
          });
          core.setOutput('release_url', response.data.html_url);
          core.setOutput('release_id', String(response.data.id));
          core.info(`Release created: ${response.data.html_url}`);

    - name: "[create-release] Resolve release tags"
      id: tags
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag_name }}
      run: |
        set -euo pipefail
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          git fetch --unshallow origin
        fi
        git fetch --force --tags origin

        previous_tag="$(git tag --sort=-version:refname \
          | awk -v current="${RELEASE_TAG}" '$0 != current { print; exit }')"
        if [ -z "${previous_tag}" ]; then
          echo "No previous release tag was found; creating the initial release without generated change notes."
          echo "has_previous=false" >> "${GITHUB_OUTPUT}"
          echo "head_ref=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        echo "has_previous=true" >> "${GITHUB_OUTPUT}"
        echo "base_ref=${previous_tag}" >> "${GITHUB_OUTPUT}"
        echo "head_ref=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
        echo "Generating notes for ${previous_tag}..${RELEASE_TAG}"

    # Non-blocking: Copilot needs AI credits of the token owner ("You have exceeded your monthly quota") and the release must not depend
    # on them. On failure the next step falls back to GitHub's own generated notes.
    - name: "[create-release] Generate release notes with Copilot"
      if: steps.tags.outputs.has_previous == 'true'
      id: notes
      continue-on-error: true
      uses: github/copilot-release-notes@main
      with:
        base-ref: ${{ steps.tags.outputs.base_ref }}
        head-ref: ${{ steps.tags.outputs.head_ref }}
        instructions: ${{ github.action_path }}/release-notes-instructions.md
        model: gpt-5.6-luna
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        COPILOT_GITHUB_TOKEN: ${{ inputs.copilot_github_token }}

    - name: "[create-release] Update GitHub release notes"
      uses: actions/github-script@v9
      env:
        RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
        RELEASE_TAG: ${{ inputs.tag_name }}
        PREVIOUS_TAG: ${{ steps.tags.outputs.base_ref }}
        RELEASE_NOTES: ${{ steps.notes.outputs.release-notes }}
        COPILOT_OUTCOME: ${{ steps.notes.outcome }}
        RELEASE_BODY: ${{ inputs.release_body }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const releaseId = Number.parseInt(process.env.RELEASE_ID, 10);

          // Copilot is optional: when it failed (no AI credits, outage) or was skipped, GitHub's own generated notes take its place
          const fallbackNotes = async () => {
            const outcome = process.env.COPILOT_OUTCOME;
            if (outcome === 'failure') {
              core.warning('Copilot release notes generation failed (for example no AI credits left); using the notes GitHub generates instead.');
            }
            const previousTag = process.env.PREVIOUS_TAG;
            try {
              const generated = await github.rest.repos.generateReleaseNotes({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: process.env.RELEASE_TAG,
                ...(previousTag ? { previous_tag_name: previousTag } : {})
              });
              return generated.data.body || '';
            } catch (error) {
              core.warning(`GitHub release notes generation failed as well: ${error.message}; the release keeps the build details only.`);
              return '';
            }
          };
          const collapseArtifactLists = (text) => {
            const lines = text.split('\n');
            const output = [];

            for (let index = 0; index < lines.length; index += 1) {
              const line = lines[index];
              const isTagList = line.trim() === 'Docker tags pushed:';
              const isPublishedArtifactList = line.trim() === 'Published artifacts:';
              if (!isTagList && !isPublishedArtifactList) {
                output.push(line);
                continue;
              }

              const tags = [];
              let nextIndex = index + 1;
              while (nextIndex < lines.length) {
                const match = lines[nextIndex].match(/^\s*-\s+(.+?)\s*$/);
                if (!match) {
                  break;
                }
                tags.push(match[1]);
                nextIndex += 1;
              }

              if (tags.length === 0) {
                output.push(line);
              } else {
                output.push(`${line.trim()} ${tags.join(', ')}`);
                index = nextIndex - 1;
              }
            }

            return output.join('\n');
          };

          const copilotNotes = (process.env.RELEASE_NOTES || '').trim();
          const generatedNotes = collapseArtifactLists(copilotNotes || await fallbackNotes());
          const additionalDetails = collapseArtifactLists(process.env.RELEASE_BODY || '');
          const body = [generatedNotes, additionalDetails].filter(Boolean).join('\n\n');

          await github.rest.repos.updateRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            release_id: releaseId,
            body
          });
          core.info(`Release notes updated for release ${releaseId}`);
