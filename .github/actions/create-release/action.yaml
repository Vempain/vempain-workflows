name: Create git tag and GitHub release

description: Optionally create a git tag and then create a GitHub release with Copilot-generated notes.

inputs:
  github_token:
    description: Token for GitHub API calls
    required: true
  copilot_github_token:
    description: Token used by Copilot to generate release notes
    required: true
  tag_name:
    description: Tag name to create and release
    required: true
  target_sha:
    description: Commit SHA the tag points to
    required: false
    default: ''
  create_tag:
    description: Whether to create the git tag before creating release
    required: false
    default: 'true'
  release_name:
    description: Release display name
    required: true
  release_body:
    description: Additional release details appended to the generated notes
    required: true
  draft:
    description: Create release as draft
    required: false
    default: 'false'
  prerelease:
    description: Mark release as prerelease
    required: false
    default: 'false'
outputs:
  release_url:
    description: URL of the created release
    value: ${{ steps.create_release.outputs.release_url }}
  release_id:
    description: ID of the created release
    value: ${{ steps.create_release.outputs.release_id }}

runs:
  using: composite
  steps:
    - name: Create git tag
      if: inputs.create_tag == 'true'
      uses: actions/github-script@v9
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const tag = '${{ inputs.tag_name }}';
          const sha = '${{ inputs.target_sha }}' || context.sha;
          try {
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha
            });
          } catch (error) {
            if (error.status !== 422) {
              throw error;
            }

            const existing = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${tag}`
            });
            if (existing.data.object.sha !== sha) {
              throw new Error(`Tag ${tag} already exists at ${existing.data.object.sha}, expected ${sha}.`);
            }
            core.info(`Tag ${tag} already points to ${sha}; continuing.`);
          }

    - name: Create GitHub Release
      id: create_release
      uses: actions/github-script@v9
      env:
        RELEASE_TAG: ${{ inputs.tag_name }}
        RELEASE_NAME: ${{ inputs.release_name }}
        RELEASE_BODY: ${{ inputs.release_body }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const tag = process.env.RELEASE_TAG;
          const response = await github.rest.repos.createRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag_name: tag,
            name: process.env.RELEASE_NAME,
            body: process.env.RELEASE_BODY,
            draft: ${{ inputs.draft == 'true' }},
            prerelease: ${{ inputs.prerelease == 'true' }}
          });
          core.setOutput('release_url', response.data.html_url);
          core.setOutput('release_id', String(response.data.id));
          core.info(`Release created: ${response.data.html_url}`);

    - name: Resolve release tags
      id: tags
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag_name }}
      run: |
        set -euo pipefail
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          git fetch --unshallow origin
        fi
        git fetch --force --tags origin

        previous_tag="$(git tag --sort=-version:refname \
          | awk -v current="${RELEASE_TAG}" '$0 != current { print; exit }')"
        if [ -z "${previous_tag}" ]; then
          echo "No previous release tag was found." >&2
          exit 1
        fi

        echo "base-ref=${previous_tag}" >> "${GITHUB_OUTPUT}"
        echo "head-ref=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
        echo "Generating notes for ${previous_tag}..${RELEASE_TAG}"

    - name: Generate release notes with Copilot
      id: notes
      uses: github/copilot-release-notes@main
      with:
        base-ref: ${{ steps.tags.outputs.base-ref }}
        head-ref: ${{ steps.tags.outputs.head-ref }}
        instructions: ${{ github.action_path }}/release-notes-instructions.md
        model: gpt-5.6-luna
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        COPILOT_GITHUB_TOKEN: ${{ inputs.copilot_github_token }}

    - name: Update GitHub release notes
      uses: actions/github-script@v9
      env:
        RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
        RELEASE_NOTES: ${{ steps.notes.outputs.release-notes }}
        RELEASE_BODY: ${{ inputs.release_body }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const releaseId = Number.parseInt(process.env.RELEASE_ID, 10);
          const generatedNotes = process.env.RELEASE_NOTES || '';
          const additionalDetails = process.env.RELEASE_BODY || '';
          const body = [generatedNotes, additionalDetails].filter(Boolean).join('\n\n');

          await github.rest.repos.updateRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            release_id: releaseId,
            body
          });
          core.info(`Release notes updated for release ${releaseId}`);
